name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPACT_VERSION: 0.31.1
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Compact compiler
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/compact" update "$COMPACT_VERSION"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile contract (with ZK keys)
        run: bun run compact

      - name: Typecheck
        run: bun run typecheck

      - name: Contract tests
        run: bun run test

      - name: Build contract and interface
        run: bun run build
